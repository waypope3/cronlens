[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cronlens"
version = "0.1.0"
description = "Human-readable cron expression parser and next-run visualizer for the terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["cron", "cli", "scheduler", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
cronlens = "cronlens.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["cronlens"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
